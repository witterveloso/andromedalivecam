name: Publish Andromeda Cam
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Montar o pacote num job e publicar em outro: o deploy só começa depois que o GitHub registrou o pacote.
  # No mesmo job ele às vezes procurava cedo demais ("Found 0 artifact(s)") e a publicação falhava.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure public gateway address
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,pathlib
          value=os.environ.get('GATEWAY_URL','').strip()
          if value:
              u=urllib.parse.urlsplit(value)
              if u.scheme!='https' or not u.hostname or u.username or u.password or u.path not in ('','/') or u.query or u.fragment:
                  raise SystemExit('GATEWAY_URL must be an HTTPS origin')
              value=value.rstrip('/')
          pathlib.Path('docs/config.js').write_text('window.ANDROMEDA_GATEWAY = '+json.dumps(value)+';\n')
          PY
      - name: Proteger o código do app da câmera (compactado, sem comentários, aviso de direitos)
        run: |
          for f in docs/cam.js docs/optics.js docs/relay.js docs/remoto.js docs/ponto.js; do
            npx --yes terser@5.36.0 "$f" --ecma 2022 -c -m --comments false --preamble "/*! Andrômeda Cam © Andrômeda Live — todos os direitos reservados. Proibidos cópia e engenharia reversa. */" -o "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
