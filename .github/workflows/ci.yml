name: Andromeda Live CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Testes do serviço (codificador, destinos, gravação, câmeras, licença)
        run: npm test
      - name: Teste da mesa (DOM)
        run: npm run test:ui
      - name: Testes da configuração do gateway
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s test -p "*_test.py"
      - name: Validar e construir o contêiner do gateway
        if: runner.os == 'Linux'
        env:
          CAM_DOMAIN: cam.example.com
          TURN_HOST: turn.example.com
        run: |
          # Valores descartáveis só para este teste; os reais são gerados por cloud/configure.py no VPS.
          export CLOUD_TOKEN=$(openssl rand -hex 32) TURN_SECRET=$(openssl rand -hex 32)
          touch cloud/turnserver.conf
          docker compose -f cloud/compose.yaml config --quiet
          docker build -f cloud/Dockerfile -t andromeda-gateway:ci .
          docker run -d --name gw -e CLOUD_ORIGIN=https://cam.example.com -e CLOUD_TOKEN -e TURN_HOST -e TURN_SECRET -p 8080:8080 andromeda-gateway:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok":true'
          docker rm -f gw

  transmission:
    name: Vídeo real e gravação (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Transmissão real local e gravação simultânea (1080p30)
        run: npx electron test/transmission-electron.cjs
      - name: Guardar diagnóstico do teste de transmissão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transmission-diagnostic
          path: |
            transmission-report.json
            transmission-screen.png
          if-no-files-found: warn

  transmission-4k:
    name: Diagnóstico 4K30 (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    # O runner compartilhado pode não ter GPU 4K. Preservamos o diagnóstico sem bloquear o instalador 1080p.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Envio local 4K30 e gravação no mesmo fluxo
        env:
          ANDROMEDA_TEST_4K: '1'
        run: npx electron test/transmission-electron.cjs
      - name: Guardar diagnóstico 4K
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transmission-4k-diagnostic
          path: |
            transmission-report.json
            transmission-screen.png
          if-no-files-found: warn

  windows-installer:
    name: Instalador Windows
    needs: [test, transmission]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # só para publicar o instalador na página de versões (releases) a partir da main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar instalador (assina se houver certificado configurado)
        shell: pwsh
        env:
          # Nada disso é obrigatório: sem os segredos o instalador sai sem assinatura, como antes. Veja ASSINATURA.md.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZ_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZ_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          WIN_PFX_BASE64: ${{ secrets.WIN_CSC_LINK }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $extra = @(); $mode = 'none'
          if ($env:AZ_SIGN_ENDPOINT -and $env:AZ_SIGN_ACCOUNT -and $env:AZ_SIGN_PROFILE -and $env:AZURE_CLIENT_ID) {
            $mode = 'azure'
            $extra += "-c.win.azureSignOptions.endpoint=$env:AZ_SIGN_ENDPOINT", "-c.win.azureSignOptions.codeSigningAccountName=$env:AZ_SIGN_ACCOUNT", "-c.win.azureSignOptions.certificateProfileName=$env:AZ_SIGN_PROFILE"
            if ($env:WIN_PUBLISHER_NAME) { $extra += "-c.win.azureSignOptions.publisherName=$env:WIN_PUBLISHER_NAME" }
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          } elseif ($env:WIN_PFX_BASE64) {
            $mode = 'pfx'; $env:CSC_LINK = $env:WIN_PFX_BASE64; $env:CSC_KEY_PASSWORD = $env:WIN_PFX_PASSWORD
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host '::warning::Instalador SEM assinatura de código: o Windows mostrará "Editor desconhecido". Configure a assinatura (ASSINATURA.md).'
          }
          "SIGNING_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Modo de assinatura: $mode"
          npm run dist:win -- @extra
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o instalador' }
      - name: Conferir a assinatura e gerar as somas SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\*.exe
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0}: {1} {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($env:SIGNING_MODE -ne 'none' -and $sig.Status -ne 'Valid') { throw "Assinatura inválida em $($f.Name): $($sig.Status)" }
          }
          # Somas para o usuário conferir o arquivo baixado (certutil -hashfile <arquivo> SHA256).
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - name: Abrir o programa empacotado e conferir a mesa
        shell: pwsh
        run: |
          # Confere a versão portátil exatamente como o usuário a recebe: o zip extraído.
          $zip = Get-ChildItem dist\*-portatil-windows.zip | Select-Object -First 1
          if (-not $zip) { throw 'Zip portátil não foi gerado' }
          $portable = Join-Path $env:RUNNER_TEMP 'portatil'
          Expand-Archive -Path $zip.FullName -DestinationPath $portable -Force
          $result = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $exe = Join-Path $portable 'Andromeda Live.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $portable; throw 'Andromeda Live.exe não está na raiz do zip' }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test=$result" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'O programa não terminou a conferência em 120 s' }
          Get-Content $result
          $data = Get-Content $result | ConvertFrom-Json
          if (-not $data.ok) { throw 'Conferência falhou' }
          if ($data.ffmpeg -notmatch 'app\.asar\.unpacked') { throw "FFmpeg fora do pacote: $($data.ffmpeg)" }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'smoke.*') dist\
      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-Live-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/smoke.json
            dist/smoke.png
          if-no-files-found: error
          retention-days: 30
      - name: Publicar na página de versões (somente main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if (-not (Test-Path dist\*.exe) -or -not (Test-Path dist\*.zip)) { throw 'Instalador ou zip portátil ausente em dist/' }
          # O próprio gh expande o padrão; nada de listas do PowerShell (um item único virava letras soltas).
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag 'dist/*.exe' 'dist/*.zip' 'dist/SHA256SUMS.txt' --clobber }
          else {
            # Notas da própria versão: 0.14.x -> ATUALIZACAO_014.md (sem o arquivo, o README).
            $parts = $version.Split('.'); $notes = 'ATUALIZACAO_{0}{1:D2}.md' -f $parts[0], [int]$parts[1]
            if (-not (Test-Path $notes)) { $notes = 'README.md' }
            gh release create $tag 'dist/*.exe' 'dist/*.zip' 'dist/SHA256SUMS.txt' --title "Andrômeda Live $version" --notes-file $notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a versão' }
