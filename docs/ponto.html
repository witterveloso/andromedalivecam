<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss: ws:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="./icon.png" type="image/png">
<link rel="stylesheet" href="./ponto.css">
<title>Andrômeda Live · Ponto</title>
</head>
<body data-state="idle" data-cue="off">
<header class="bar">
  <span class="brand">ANDRÔMEDA <b>PONTO</b></span>
  <strong id="who">Ponto</strong>
  <span id="status" class="status" role="status">Abra o link enviado pela direção.</span>
</header>

<main>
  <section id="gate" class="gate">
    <h1>Ponto da direção</h1>
    <p>Coloque o fone de ouvido. A direção fala com você por aqui durante o programa, por um caminho separado das câmeras.</p>
    <button id="enter" type="button" class="primary" disabled>ENTRAR NO PONTO</button>
    <p class="fine">O microfone só abre enquanto você segura "Falar com a direção".</p>
  </section>

  <section id="live" class="live" hidden>
    <div id="cue" class="cue" aria-live="assertive"><span class="dot"></span><span id="cueText">DIREÇÃO EM SILÊNCIO</span></div>
    <div id="note" class="note" hidden aria-live="assertive"><small id="noteTime"></small><p id="noteText"></p></div>
    <div class="controls">
      <label class="vol">Volume do ponto <input id="volume" type="range" min="0" max="100" value="85" aria-label="Volume do ponto"><output id="volumeOut">85</output></label>
      <button id="ret" type="button" class="toggle" aria-pressed="false">Retorno do programa: DESLIGADO</button>
    </div>
    <button id="talk" type="button" class="talk" aria-pressed="false">SEGURE PARA FALAR COM A DIREÇÃO</button>
  </section>
</main>
<audio id="ear" autoplay playsinline></audio>
<script src="./config.js"></script>
<script src="./relay.js"></script>
<script src="./ponto.js"></script>
</body>
</html>
